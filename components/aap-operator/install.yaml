---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # The minio-ansible Tenant (50Gi) also lives in this namespace. Delete=false
    # keeps an Application-deletion cascade from taking the namespace, and the
    # tenant with it.
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    openshift.io/cluster-monitoring: "true"
  name: ansible-automation-platform
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: ansible-automation-platform-operator
  namespace: ansible-automation-platform
spec:
  targetNamespaces:
    - ansible-automation-platform
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ansible-automation-platform
  namespace: ansible-automation-platform
spec:
  channel: stable-2.6
  # Manual while AAP is scaled to zero: an automatic z-stream upgrade reinstalls
  # the CSV, which restores replicas=1 on all seven controller-managers and
  # silently undoes the scale-down. Set back to Automatic when AAP is re-enabled.
  installPlanApproval: Manual
  name: ansible-automation-platform-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
