# Grafana itself stores nothing that matters here - it is the query surface for
# Loki, Mimir and the cluster's own Thanos. No PVC on purpose: every datasource
# and dashboard is a CR in git, so an empty Grafana rebuilds itself, and one
# less stateful component keeps the storage measurement uncontaminated.
#
# Admin credentials are generated by the operator, not stored in git:
#   oc -n grafana-lab get secret grafana-lab-admin-credentials \
#     -o go-template='{{index .data "GF_SECURITY_ADMIN_USER"|base64decode}}{{"\n"}}{{index .data "GF_SECURITY_ADMIN_PASSWORD"|base64decode}}{{"\n"}}'
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana-lab
  namespace: grafana-lab
  labels:
    dashboards: grafana-lab
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  config:
    log:
      mode: console
    auth:
      disable_login_form: "false"
    users:
      viewers_can_edit: "true"
    analytics:
      reporting_enabled: "false"
      check_for_updates: "false"
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "2", memory: 2Gi }
  route:
    spec:
      port:
        targetPort: grafana
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      to:
        kind: Service
        name: grafana-lab-service
        weight: 100
      wildcardPolicy: None
