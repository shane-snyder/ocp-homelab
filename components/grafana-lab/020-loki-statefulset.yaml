# Loki monolithic. StatefulSet for the same reason as Mimir: the ingester's WAL
# lives on the PVC and must survive a restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: grafana-lab
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: grafana-lab
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: grafana-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.7.6
          args:
            - -config.file=/etc/loki/loki.yaml
            - -target=all
          ports:
            - { name: http-metrics, containerPort: 3100 }
            - { name: grpc, containerPort: 9096 }
          readinessProbe:
            httpGet: { path: /ready, port: http-metrics }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /ready, port: http-metrics }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "4", memory: 8Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: storage, mountPath: /loki }
        # Same exporter as Mimir, pointed at Loki's directories. For logs the
        # interesting split is chunks (the payload) vs index (the tax you pay
        # for label cardinality) - they scale very differently.
        - name: du-exporter
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "-u", "/opt/exporter/du_exporter.py"]
          env:
            - { name: COMPONENT, value: loki }
            - { name: SCAN_PATHS, value: "chunks=/loki/chunks,index=/loki/tsdb-index,index_shipped=/loki/tsdb-cache,wal=/loki/wal" }
            - { name: SCAN_INTERVAL, value: "120" }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          ports:
            - { name: du-metrics, containerPort: 9110 }
          readinessProbe:
            httpGet: { path: /metrics, port: du-metrics }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: exporter, mountPath: /opt/exporter }
            - { name: storage, mountPath: /loki, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: exporter
          configMap:
            name: du-exporter
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: lvms-dell
        resources:
          requests:
            storage: 100Gi
