# Mimir monolithic. StatefulSet rather than Deployment because the ingester
# keeps a write-ahead log on the PVC and must reattach to it across restarts -
# losing the WAL would lose samples and understate the measured volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: grafana-lab
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: grafana-lab
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
        app.kubernetes.io/part-of: grafana-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      containers:
        - name: mimir
          image: docker.io/grafana/mimir:3.1.5
          args:
            - -config.file=/etc/mimir/mimir.yaml
          ports:
            - { name: http-metrics, containerPort: 8080 }
            - { name: grpc, containerPort: 9095 }
            - { name: memberlist, containerPort: 7946 }
          readinessProbe:
            httpGet: { path: /ready, port: http-metrics }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /ready, port: http-metrics }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests: { cpu: "1", memory: 8Gi }
            limits: { cpu: "8", memory: 24Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/mimir }
            - { name: storage, mountPath: /data }
        # Splits the shared PVC into per-tenant bytes. Without this the only
        # available number is the combined total for both ingest paths.
        - name: du-exporter
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "-u", "/opt/exporter/du_exporter.py"]
          env:
            - { name: COMPONENT, value: mimir }
            - { name: SCAN_PATHS, value: "blocks=/data/blocks,ingester_tsdb=/data/tsdb" }
            - { name: SCAN_INTERVAL, value: "120" }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          ports:
            - { name: du-metrics, containerPort: 9110 }
          readinessProbe:
            httpGet: { path: /metrics, port: du-metrics }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: exporter, mountPath: /opt/exporter }
            - { name: storage, mountPath: /data, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: exporter
          configMap:
            name: du-exporter
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: lvms-dell
        resources:
          requests:
            storage: 200Gi
