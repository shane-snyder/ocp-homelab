# Node-scoped collector: everything that has to be read from the node itself.
#
#   filelog      -> OTLP logs    -> Loki
#   kubeletstats -> OTLP metrics -> Mimir tenant "otlp"
#   hostmetrics  -> OTLP metrics -> Mimir tenant "otlp"
#
# Cluster-scoped signals live in the companion deployment collector so they are
# not multiplied by node count if this lab is ever moved off SNO.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-node
  namespace: grafana-lab
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  mode: daemonset
  serviceAccount: otel-collector
  managementState: managed
  upgradeStrategy: none
  securityContext:
    privileged: true
    runAsUser: 0
  # hostmetrics reads /proc/net through the collector's own network namespace,
  # whatever root_path says. In the pod network it reports the pod's eth0, not
  # the node's NICs. The host network also gives host.name the node's name
  # rather than the pod's, which otherwise changed on every pod restart.
  hostNetwork: true
  tolerations:
    - operator: Exists
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    # The kubelet is addressed by IP, not by node name: node names are not
    # guaranteed to resolve to the node from inside the pod network, and a
    # name that resolves somewhere else yields a 401 from a kubelet that has
    # no idea who this token belongs to.
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    # Read by the resourcedetection "env" detector. hostmetrics has no pod to
    # associate with, so without this its series carry no k8s.node.name and
    # cannot be joined to the kubeletstats / k8s_cluster series per node.
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: k8s.node.name=$(K8S_NODE_NAME)
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: otelcol-state
      hostPath:
        path: /var/lib/otelcol/grafana-lab
        type: DirectoryOrCreate
    - name: hostfs
      hostPath:
        path: /
  volumeMounts:
    - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
    - { name: otelcol-state, mountPath: /var/lib/otelcol }
    - { name: hostfs, mountPath: /hostfs, readOnly: true, mountPropagation: HostToContainer }
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "4", memory: 4Gi }
  config:
    extensions:
      # Checkpoints filelog's read offsets on the host. Without it a collector
      # restart re-reads from the file start and double-counts, which would
      # show up as a phantom spike in the log volume being measured.
      #
      # The bbolt file once corrupted on an unclean shutdown and the collector
      # panicked on every start for weeks after (checkInvariantProperties in
      # freepages). fsync makes each checkpoint durable before it is relied
      # on. bbolt never shrinks its file on its own, and this one had grown
      # to 200Mi; compaction on start rewrites it to its live size.
      file_storage/checkpoints:
        directory: /var/lib/otelcol
        create_directory: true
        timeout: 10s
        fsync: true
        compaction:
          on_start: true
          directory: /var/lib/otelcol

    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # This stack's own logs. Loki logging about ingesting logs, ingested
          # by the collector, is feedback that inflates the number under test.
          - /var/log/pods/grafana-lab_*/*/*.log
        include_file_path: true
        include_file_name: false
        # Start at the tail: the sizing window begins when the collector does,
        # not whenever each node last rotated its logs.
        start_at: end
        storage: file_storage/checkpoints
        retry_on_failure:
          enabled: true
        operators:
          - id: container-parser
            type: container

      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container, volume]

      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          load: {}
          memory: {}
          disk: {}
          # Physical NICs only. On the host network the node has one OVN
          # interface per pod (~475 on sno), each a full set of series.
          network:
            include:
              interfaces: ["^(eno|ens|enp|eth|bond)[0-9a-z]+$"]
              match_type: regexp
          paging: {}
          processes: {}
          filesystem:
            exclude_fs_types:
              match_type: strict
              fs_types:
                - autofs
                - binfmt_misc
                - bpf
                - cgroup2
                - configfs
                - debugfs
                - devpts
                - devtmpfs
                - fusectl
                - hugetlbfs
                - iso9660
                - mqueue
                - nsfs
                - overlay
                - proc
                - procfs
                - pstore
                - rpc_pipefs
                - securityfs
                - selinuxfs
                - squashfs
                - sysfs
                - tracefs
            exclude_mount_points:
              match_type: regexp
              mount_points:
                - /var/lib/kubelet/.*
                - /run/.*
                - /sys/.*
                - /hostfs/var/lib/kubelet/.*

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      resourcedetection:
        detectors: [env, openshift, system]
        override: false
        timeout: 5s
      batch:
        timeout: 5s
        send_batch_size: 8192
        send_batch_max_size: 16384

    exporters:
      otlphttp/loki:
        endpoint: http://loki.grafana-lab.svc.cluster.local:3100/otlp
        compression: gzip
        sending_queue:
          enabled: true
          queue_size: 5000
        retry_on_failure:
          enabled: true
      otlphttp/mimir:
        endpoint: http://mimir.grafana-lab.svc.cluster.local:8080/otlp
        compression: gzip
        headers:
          X-Scope-OrgID: otlp
        sending_queue:
          enabled: true
          queue_size: 5000
        retry_on_failure:
          enabled: true

    service:
      extensions: [file_storage/checkpoints]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [kubeletstats, hostmetrics]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlphttp/mimir]
