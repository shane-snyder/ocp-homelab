# Node-scoped collector: everything that has to be read from the node itself.
#
#   filelog      -> OTLP logs    -> Loki
#   kubeletstats -> OTLP metrics -> Mimir tenant "otlp"
#   hostmetrics  -> OTLP metrics -> Mimir tenant "otlp"
#
# Cluster-scoped signals live in the companion deployment collector so they are
# not multiplied by node count if this lab is ever moved off SNO.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-node
  namespace: grafana-lab
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  mode: daemonset
  serviceAccount: otel-collector
  managementState: managed
  upgradeStrategy: none
  securityContext:
    privileged: true
    runAsUser: 0
  tolerations:
    - operator: Exists
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: otelcol-state
      hostPath:
        path: /var/lib/otelcol/grafana-lab
        type: DirectoryOrCreate
    - name: hostfs
      hostPath:
        path: /
  volumeMounts:
    - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
    - { name: otelcol-state, mountPath: /var/lib/otelcol }
    - { name: hostfs, mountPath: /hostfs, readOnly: true, mountPropagation: HostToContainer }
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "4", memory: 4Gi }
  config:
    extensions:
      # Checkpoints filelog's read offsets on the host. Without it a collector
      # restart re-reads from the file start and double-counts, which would
      # show up as a phantom spike in the log volume being measured.
      file_storage/checkpoints:
        directory: /var/lib/otelcol
        create_directory: true
        timeout: 10s

    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # This stack's own logs. Loki logging about ingesting logs, ingested
          # by the collector, is feedback that inflates the number under test.
          - /var/log/pods/grafana-lab_*/*/*.log
        include_file_path: true
        include_file_name: false
        # Start at the tail: the sizing window begins when the collector does,
        # not whenever each node last rotated its logs.
        start_at: end
        storage: file_storage/checkpoints
        retry_on_failure:
          enabled: true
        operators:
          - id: container-parser
            type: container

      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container, volume]

      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          load: {}
          memory: {}
          disk: {}
          network: {}
          paging: {}
          processes: {}
          filesystem:
            exclude_fs_types:
              match_type: strict
              fs_types:
                - autofs
                - binfmt_misc
                - bpf
                - cgroup2
                - configfs
                - debugfs
                - devpts
                - devtmpfs
                - fusectl
                - hugetlbfs
                - iso9660
                - mqueue
                - nsfs
                - overlay
                - proc
                - procfs
                - pstore
                - rpc_pipefs
                - securityfs
                - selinuxfs
                - squashfs
                - sysfs
                - tracefs
            exclude_mount_points:
              match_type: regexp
              mount_points:
                - /var/lib/kubelet/.*
                - /run/.*
                - /sys/.*
                - /hostfs/var/lib/kubelet/.*

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      resourcedetection:
        detectors: [env, openshift, system]
        override: false
        timeout: 5s
      batch:
        timeout: 5s
        send_batch_size: 8192
        send_batch_max_size: 16384

    exporters:
      otlphttp/loki:
        endpoint: http://loki.grafana-lab.svc.cluster.local:3100/otlp
        compression: gzip
        sending_queue:
          enabled: true
          queue_size: 5000
        retry_on_failure:
          enabled: true
      otlphttp/mimir:
        endpoint: http://mimir.grafana-lab.svc.cluster.local:8080/otlp
        compression: gzip
        headers:
          X-Scope-OrgID: otlp
        sending_queue:
          enabled: true
          queue_size: 5000
        retry_on_failure:
          enabled: true

    service:
      extensions: [file_storage/checkpoints]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [kubeletstats, hostmetrics]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlphttp/mimir]
