apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: grafana-lab
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: grafana-lab
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    # /api/v1/push          <- platform Prometheus remote_write
    # /otlp/v1/metrics      <- OTel collectors
    # /prometheus/api/v1/*  <- Grafana queries
    - { name: http-metrics, port: 8080, targetPort: http-metrics }
    - { name: grpc, port: 9095, targetPort: grpc }
    - { name: du-metrics, port: 9110, targetPort: du-metrics }
