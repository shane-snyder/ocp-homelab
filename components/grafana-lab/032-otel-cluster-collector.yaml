# Cluster-scoped collector: signals that exist once per cluster, not per node.
#
#   k8s_cluster          -> OTLP metrics -> Mimir tenant "otlp"
#   prometheus           -> OTLP metrics -> Mimir tenant "otlp"
#     (scrape jobs: kubevirt, ocp-lifecycle)
#   k8s_events           -> OTLP logs    -> Loki
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-cluster
  namespace: grafana-lab
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  mode: deployment
  replicas: 1
  serviceAccount: otel-collector
  managementState: managed
  upgradeStrategy: none
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "2", memory: 2Gi }
  config:
    receivers:
      k8s_cluster:
        collection_interval: 30s
        auth_type: serviceAccount
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory, ephemeral-storage, storage]
      k8s_events:
        auth_type: serviceAccount
      # VM metrics. No OTel receiver understands KubeVirt, so read its own
      # Prometheus endpoint: virt-handler (one per node) has the per-VMI usage
      # series, virt-controller has kubevirt_vmi_info. The endpoint is HTTPS
      # with a self-signed cert and no auth. The kubevirt-prometheus-metrics
      # service is headless with no port 443 behind it, so pods are scraped
      # directly. One deployment scraping every virt-handler is fine at this
      # size; on a large fleet move that job into the node DaemonSet.
      # One receiver, one scrape job per source: they share the pipeline, and
      # each job keeps its own job label.
      prometheus:
        config:
          scrape_configs:
            - job_name: kubevirt
              scrape_interval: 30s
              scheme: https
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [openshift-cnv]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_kubevirt_io]
                  regex: virt-handler|virt-controller
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "8443"
                  action: keep
              metric_relabel_configs:
                # Each pod also exposes 1-3k lines of Go runtime and client
                # metrics that say nothing about VMs.
                - source_labels: [__name__]
                  regex: kubevirt_vmi_.*
                  action: keep
            # Red Hat lifecycle exporter (components/ocp-lifecycle-exporter).
            - job_name: ocp-lifecycle
              scrape_interval: 30s
              static_configs:
                - targets: ["ocp-lifecycle-exporter.ocp-lifecycle.svc:9120"]
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, openshift]
        override: false
        timeout: 5s
      # The openshift detector reports the infrastructure name, which is the
      # cluster name plus a random 5-character suffix (sno-ngnxh). Drop the
      # suffix so k8s.cluster.name is the name the cluster was installed with.
      # Only the final "-xxxxx" goes: my-cluster-01-xsahr -> my-cluster-01.
      transform/cluster-name:
        metric_statements:
          - statements:
              - replace_pattern(resource.attributes["k8s.cluster.name"], "-[a-z0-9]{5}$", "")
        log_statements:
          - statements:
              - replace_pattern(resource.attributes["k8s.cluster.name"], "-[a-z0-9]{5}$", "")
      batch:
        timeout: 5s
        send_batch_size: 8192
        send_batch_max_size: 16384

    exporters:
      otlphttp/loki:
        endpoint: http://loki.grafana-lab.svc.cluster.local:3100/otlp
        compression: gzip
        retry_on_failure:
          enabled: true
      otlphttp/mimir:
        endpoint: http://mimir.grafana-lab.svc.cluster.local:8080/otlp
        compression: gzip
        headers:
          X-Scope-OrgID: otlp
        retry_on_failure:
          enabled: true

    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        metrics:
          receivers: [k8s_cluster, prometheus]
          processors: [memory_limiter, resourcedetection, transform/cluster-name, batch]
          exporters: [otlphttp/mimir]
        logs:
          receivers: [k8s_events]
          processors: [memory_limiter, resourcedetection, transform/cluster-name, batch]
          exporters: [otlphttp/loki]
