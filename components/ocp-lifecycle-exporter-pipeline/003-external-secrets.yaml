---
# Quay robot with write access to ocp-lifecycle/ocp-lifecycle-exporter.
# config.json format for buildah/skopeo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quay-push-credentials
  namespace: ocp-lifecycle
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-sno
  target:
    name: quay-push-credentials
    creationPolicy: Owner
  data:
    - secretKey: config.json
      remoteRef:
        key: ocp-lifecycle/pipeline-quay-push
        property: config.json
---
# GitHub API token for the poller. The repo is public, but anonymous API calls
# share a 60/h limit per egress IP; reuse the existing Argo CD repo token.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: ocp-lifecycle
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-sno
  target:
    name: github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: argocd-agent/repo-ocp-apps
        property: password
