---
# Quay robot with write access to ocp-lifecycle/ocp-lifecycle-exporter.
# config.json format for buildah/skopeo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quay-push-credentials
  namespace: ocp-lifecycle
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-sno
  target:
    name: quay-push-credentials
    creationPolicy: Owner
  data:
    - secretKey: config.json
      remoteRef:
        key: ocp-lifecycle/pipeline-quay-push
        property: config.json
