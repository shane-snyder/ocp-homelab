apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Builds ocp-lifecycle-exporter into the homelab Quay. Runs on sno only (Quay
# and OpenShift Pipelines live there); the image is pulled by every cluster.
# Same shape as ocp-apps' x-followers pipeline: a CronJob polls GitHub, and a
# new commit touching the exporter starts a PipelineRun.
namespace: ocp-lifecycle

resources:
  - 001-rbac.yaml
  - 002-pipeline.yaml
  - 003-external-secrets.yaml
  - 004-poll-cronjob.yaml
