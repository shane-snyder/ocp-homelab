apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ocp-lifecycle-exporter-build
  namespace: ocp-lifecycle
spec:
  description: >
    Clones ocp-lifecycle-dashboard, runs the unit tests, builds the exporter
    with buildah, pushes it to quay as :latest and :<sha>, and restarts the
    exporter on this cluster. Other clusters pick up :latest on their next
    pod restart (imagePullPolicy: Always).
  params:
    - name: repo-url
      type: string
      default: https://github.com/shane-snyder/ocp-lifecycle-dashboard.git
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      default: quay-server.apps.sno.shanehomelab.com/ocp-lifecycle/ocp-lifecycle-exporter

  workspaces:
    - name: source
    - name: docker-credentials
      description: Secret with config.json for quay push auth

  tasks:
    # The repo is public, so no git credentials.
    - name: git-clone
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: namespace, value: openshift-pipelines }
      params:
        - { name: URL, value: $(params.repo-url) }
        - { name: REVISION, value: $(params.revision) }
        - { name: DELETE_EXISTING, value: "true" }
      workspaces:
        - { name: output, workspace: source }

    # Same gate the GitHub workflow runs; a failing test never reaches quay.
    - name: test
      runAfter: [git-clone]
      workspaces:
        - { name: source, workspace: source }
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: unittest
            image: registry.access.redhat.com/ubi9/python-312:latest
            workingDir: $(workspaces.source.path)
            env:
              - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            script: |
              python3 -m unittest discover -s tests -t . -v

    - name: build
      runAfter: [test]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: namespace, value: openshift-pipelines }
      params:
        - { name: IMAGE, value: "$(params.image):$(tasks.git-clone.results.COMMIT)" }
        - { name: CONTEXT, value: . }
        - { name: DOCKERFILE, value: ./Containerfile }
        # Let's Encrypt cert on the quay route, so verification stays on.
        - { name: TLS_VERIFY, value: "true" }
      workspaces:
        - { name: source, workspace: source }
        - { name: dockerconfig, workspace: docker-credentials }

    # buildah pushes one tag; copy the immutable sha tag to :latest.
    - name: tag-latest
      runAfter: [build]
      workspaces:
        - { name: dockerconfig, workspace: docker-credentials }
      taskSpec:
        workspaces:
          - name: dockerconfig
        steps:
          - name: skopeo-copy
            image: registry.redhat.io/rhel9/skopeo:latest
            script: |
              skopeo copy --all \
                --authfile $(workspaces.dockerconfig.path)/config.json \
                docker://$(params.image)@$(tasks.build.results.IMAGE_DIGEST) \
                docker://$(params.image):latest

    - name: rollout
      runAfter: [tag-latest]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: openshift-client }
          - { name: namespace, value: openshift-pipelines }
      params:
        - name: SCRIPT
          value: |
            oc rollout restart deployment/ocp-lifecycle-exporter -n ocp-lifecycle
            oc rollout status deployment/ocp-lifecycle-exporter -n ocp-lifecycle --timeout=5m
