---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-poller
  namespace: ocp-lifecycle
---
# Creates PipelineRuns and keeps the last-built SHA in a ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-poller
  namespace: ocp-lifecycle
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "list", "get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-poller
  namespace: ocp-lifecycle
subjects:
  - kind: ServiceAccount
    name: pipeline-poller
    namespace: ocp-lifecycle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-poller
---
# Unlike the x-followers poller, the first run builds: there is no image in
# quay yet, and the exporter Deployment cannot start until there is.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ocp-lifecycle-exporter-pipeline-poll
  namespace: ocp-lifecycle
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: pipeline-poller
          restartPolicy: Never
          containers:
            - name: poller
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              env:
                # The repo is public, so polling works anonymously (60 API
                # calls/h per IP; this uses ~12). Create a github-token Secret
                # to authenticate instead.
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-token
                      key: token
                      optional: true
                - { name: GITHUB_REPO, value: shane-snyder/ocp-lifecycle-dashboard }
                - { name: WATCH_BRANCH, value: main }
                - { name: CONFIGMAP_NAME, value: pipeline-poll-status }
                - { name: NAMESPACE, value: ocp-lifecycle }
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  api() {
                    local url="https://api.github.com/repos/${GITHUB_REPO}/$1"
                    if [ -n "${GITHUB_TOKEN:-}" ]; then
                      curl -sf -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.v3+json" "$url"
                    else
                      curl -sf -H "Accept: application/vnd.github.v3+json" "$url"
                    fi
                  }

                  NEW_SHA=$(api "branches/${WATCH_BRANCH}" | python3 -c \
                    "import json,sys; print(json.load(sys.stdin)['commit']['sha'])")
                  echo "Current SHA on ${WATCH_BRANCH}: ${NEW_SHA}"

                  OLD_SHA=$(oc get configmap "${CONFIGMAP_NAME}" -n "${NAMESPACE}" \
                    -o jsonpath='{.data.sha}' 2>/dev/null || true)

                  if [ "${NEW_SHA}" = "${OLD_SHA}" ]; then
                    echo "No new commits - nothing to do"
                    exit 0
                  fi

                  if [ -n "${OLD_SHA}" ]; then
                    # Only rebuild for changes that end up in the image or gate it.
                    CHANGED=$(api "compare/${OLD_SHA}...${NEW_SHA}" | python3 -c "
                  import json, sys
                  files = [f['filename'] for f in json.load(sys.stdin).get('files', [])]
                  hits = [f for f in files if f.startswith(('ocp_lifecycle_exporter/', 'tests/')) or f == 'Containerfile']
                  print('yes' if hits else 'no')
                  " || echo "yes")
                    if [ "${CHANGED}" = "no" ]; then
                      echo "No exporter changes in ${OLD_SHA:0:8}..${NEW_SHA:0:8} - skipping build"
                      oc patch configmap "${CONFIGMAP_NAME}" -n "${NAMESPACE}" \
                        --type merge -p "{\"data\":{\"sha\":\"${NEW_SHA}\"}}"
                      exit 0
                    fi
                  fi

                  cat <<EOF | oc create -f -
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    generateName: ocp-lifecycle-exporter-build-
                    namespace: ${NAMESPACE}
                  spec:
                    pipelineRef:
                      name: ocp-lifecycle-exporter-build
                    taskRunTemplate:
                      serviceAccountName: pipeline
                    params:
                      - name: revision
                        value: "${NEW_SHA}"
                    workspaces:
                      - name: source
                        volumeClaimTemplate:
                          spec:
                            accessModes: ["ReadWriteOnce"]
                            storageClassName: lvms-dell
                            resources:
                              requests:
                                storage: 1Gi
                      - name: docker-credentials
                        secret:
                          secretName: quay-push-credentials
                    timeouts:
                      pipeline: 30m
                  EOF

                  # Record the SHA only after the PipelineRun exists, so a failed
                  # create is retried on the next tick.
                  if [ -n "${OLD_SHA}" ]; then
                    oc patch configmap "${CONFIGMAP_NAME}" -n "${NAMESPACE}" \
                      --type merge -p "{\"data\":{\"sha\":\"${NEW_SHA}\"}}"
                  else
                    oc create configmap "${CONFIGMAP_NAME}" -n "${NAMESPACE}" \
                      --from-literal="sha=${NEW_SHA}" --from-literal="branch=${WATCH_BRANCH}"
                  fi
                  echo "PipelineRun created for ${NEW_SHA:0:8}"
