---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: ocp-lifecycle
---
# Lets the last pipeline step restart the exporter so it pulls the new :latest.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-deployer
  namespace: ocp-lifecycle
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-deployer
  namespace: ocp-lifecycle
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: ocp-lifecycle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-deployer
---
# buildah needs it, as in the x-followers pipeline.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-privileged-scc
  namespace: ocp-lifecycle
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: ocp-lifecycle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
