apiVersion: apps/v1
kind: Deployment
metadata:
  name: synctest
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: synctest
spec:
  replicas: 1
  # Default is 600s. Kept short so a wave that never goes Healthy fails in
  # about two minutes instead of stalling the run for ten.
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: synctest
  template:
    metadata:
      labels:
        app: synctest
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /var/www/html
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: content
          configMap:
            name: synctest-content
