# The data changes every few hours at most, and ACM forwards every 5 minutes,
# so a slow scrape loses nothing.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ocp-lifecycle-exporter
  namespace: ocp-lifecycle
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ocp-lifecycle-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 2m
      scrapeTimeout: 30s
