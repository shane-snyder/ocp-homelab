# Red Hat lifecycle exporter: polls the Product Life Cycle API and joins it
# against this cluster's ClusterVersion and operator Subscriptions.
# Source: https://github.com/shane-snyder/ocp-lifecycle-dashboard
#
# Labelled for *platform* monitoring on purpose. ACM observability only
# federates from the platform Prometheus, and the uwl_metrics_list path is
# deliberately emptied in acm-observability (it brings back the
# uwl-metrics-collector and its 409s). Platform scraping is what gets these
# series to the hub.
apiVersion: v1
kind: Namespace
metadata:
  name: ocp-lifecycle
  labels:
    openshift.io/cluster-monitoring: "true"
  annotations:
    openshift.io/display-name: "OpenShift lifecycle exporter"
    argocd.argoproj.io/sync-wave: "1"
