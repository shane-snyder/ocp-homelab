# WARNING: this ConfigMap already existed on the cluster and was NOT previously
# managed by git. Everything except the remoteWrite block below is a verbatim
# copy of what was live at the time this was written - in particular the
# additionalAlertmanagerConfigs and externalLabels stanzas, which ACM
# observability injected. Re-check them against the cluster before syncing:
#
#   oc -n openshift-monitoring get cm cluster-monitoring-config \
#     -o go-template='{{index .data "config.yaml"}}'
#
# If ACM re-injects those fields later, the content will match what is here and
# no drift appears. If ACM changes them, this file must be updated to match or
# the two will fight.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "18"
data:
  config.yaml: |
    enableUserWorkload: true
    nodeExporter:
      collectors:
        buddyinfo: {}
        cpufreq: {}
        ksmd: {}
        mountstats: {}
        netclass: {}
        netdev: {}
        processes: {}
        systemd: {}
        tcpstat: {}
    prometheusK8s:
      additionalAlertmanagerConfigs:
      - apiVersion: v2
        bearerToken:
          key: token
          name: observability-alertmanager-accessor-147abfa517f849d3843
        scheme: https
        staticConfigs:
        - alertmanager-open-cluster-management-observability.apps.sno.shanehomelab.com
        tlsConfig:
          ca:
            key: service-ca.crt
            name: hub-alertmanager-router-ca-147abfa517f849d3843
          insecureSkipVerify: false
      externalLabels:
        managed_cluster: 147abfa5-17f8-49d3-8436-9f4cb488cd5d
      # --- Telemetry storage sizing lab (components/grafana-lab) -------------
      # Ships every platform metric to Mimir tenant "remotewrite". Deliberately
      # unfiltered: the point is to measure what a full remote_write feed costs,
      # so a writeRelabelConfigs keep-list would answer a different question.
      #
      # ~900k active series leave this cluster continuously once this is on. To
      # stop the experiment, delete this remoteWrite block and re-sync - nothing
      # else here depends on it.
      remoteWrite:
      - url: http://mimir.grafana-lab.svc.cluster.local:8080/api/v1/push
        name: grafana-lab-mimir
        headers:
          X-Scope-OrgID: remotewrite
        queueConfig:
          capacity: 10000
          maxSamplesPerSend: 5000
          maxShards: 50
          minShards: 1
          batchSendDeadline: 5s
          minBackoff: 100ms
          maxBackoff: 10s
    thanosQuerier:
      resources:
        limits:
          cpu: 50m
          memory: 2Gi
        requests:
          cpu: 5m
          memory: 125Mi
