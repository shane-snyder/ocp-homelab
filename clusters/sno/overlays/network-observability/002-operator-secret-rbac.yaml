# NOO 1.12+ no longer has cluster-wide Secret access; it must be granted per
# namespace. Without these the operator can't read the LokiStack's
# query-frontend TLS secret, and the FlowCollector/console plugin reconcile
# fails with "make sure you grant Secret access permissions to the operator".
# ClusterRoles are shipped by the operator CSV.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-watcher
  namespace: netobserv
  annotations:
    argocd.argoproj.io/sync-wave: "9"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netobserv-secret-watcher
subjects:
  - kind: ServiceAccount
    name: netobserv-controller-manager
    namespace: openshift-netobserv-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-creator
  namespace: netobserv
  annotations:
    argocd.argoproj.io/sync-wave: "9"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netobserv-secret-creator
subjects:
  - kind: ServiceAccount
    name: netobserv-controller-manager
    namespace: openshift-netobserv-operator
